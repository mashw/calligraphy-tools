name: Interlace branch validation
on:
  pull_request:
    branches: [feature/unified-editor-ui]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'feature/interlace-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Compare narrow Woven interaction against the PR base on failure
        if: failure()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/interlace-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/interlace-base"
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          npx playwright test tests/woven-layout.spec.ts -g 'Woven movement.*390px'
