name: Interlace branch validation
on:
  pull_request:
    branches: [feature/unified-editor-ui]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'feature/interlace-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
